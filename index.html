<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, intital-scale=1">
        <title>Learn Conlangs online!</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="user-language-panel" class="hidden">
            <div id="main-page-overlay"></div>
            <div id="user-language-panel-items">
                <div id="user-login">
                    <label for="username">Username: </label>
                    <input type="text" id="username">
                    <button onclick="login()">Switch to user</button>
                </div>
                <div id="language-selection">
                    <label for="learning-language">Learning Language: </label>
                    <select id="learning-language"></select>
                    <button onclick="switchLearningLanguage()">Switch to learning language</button>
                </div>
            </div>
        </div>
        <button id="menu-button" onclick="document.getElementById('user-language-panel').classList.toggle('hidden')">Menu</button>
        <div id="main-page">
            <h1 id="lesson-title"></h1>
            <div class="progress-bar">
                <label for="lesson-progress-bar">Lesson progress:</label>
                <progress id="lesson-progress-bar"></progress>
            </div>
            <h2 id="exercise-title"></h2>
            <div class="progress-bar">
                <label for="exercise-progress-bar">Exercise progress:</label>
                <progress id="exercise-progress-bar"></progress>
            </div>
            <br>
            <div id="exercise-image-container"></div>
            <input type="hidden" id="exercise-type">
            <div id="exercise-question"></div>
            <button id="exercise-submit" onclick="submitExercise()">Check answer</button>
            <div id="exercise-answer"></div>
            <button class="hidden" id="next-button" onclick="nextExercise()">Next exercise</button>
            <br>
            <br>
            <button id="resetButton" onclick="resetProgress()">Reset Progress</button>
            <div id="dictionary-link">
                <a href="dictionary.html">Look up a word in the dictionary</a>
            </div>
        </div>
        <script type="text/javascript" src="main.js"></script>
    </body>
</html>
